name: Release

# Tag and publish a GitHub Release from the changelog, on demand. Exists because
# tags cannot always be pushed from every environment; the runner holds the write
# token, so a dispatch turns a merged release commit into a tag + Release without a
# local tag push. Idempotent: a version already released is left untouched.

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v prefix (e.g. 0.3.0).
        required: true
      sha:
        description: Commit SHA to tag. Defaults to the dispatched ref.
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Tag and publish from CHANGELOG
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Every dispatched value reaches the shell through `env`, never through
      # `${{ }}` inside a `run:` block: an expression is substituted into the
      # script before bash reads it, so a quote and a semicolon would run.
      - name: Resolve target commit
        id: target
        env:
          INPUT_SHA: ${{ inputs.sha }}
          VERSION: ${{ inputs.version }}
          DEFAULT_SHA: ${{ github.sha }}
        run: |
          sha="$INPUT_SHA"
          [ -z "$sha" ] && sha="$DEFAULT_SHA"
          # Expand to a full commit sha: the release API rejects abbreviated ones.
          sha=$(git rev-parse "${sha}^{commit}")
          # Only a commit already on main is released: a tag on a feature
          # branch would publish a contract nobody merged.
          if ! git merge-base --is-ancestor "$sha" origin/main; then
            echo "Commit $sha is not on main." >&2
            exit 1
          fi
          # The commit must declare the version it is tagged with: an older
          # version keeps its changelog section on every later commit, and its
          # tag would then point at a different contract.
          declared=$(git show "$sha:package.json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0, 'utf8')).version)")
          if [ "$declared" != "$VERSION" ]; then
            echo "Commit $sha declares $declared, not $VERSION." >&2
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Extract the changelog section
        env:
          version: ${{ inputs.version }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          # The notes come from the commit being tagged, not from the checkout:
          # the two differ whenever a sha is given.
          git show "$SHA:CHANGELOG.md" | awk -v v="$version" '
            $0 ~ ("^## \\[" v "\\]") { grab = 1; next }
            grab && /^## \[/ { exit }
            grab { print }
          ' > RELEASE_NOTES.md
          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog section for [$version]." >&2
            exit 1
          fi
      - name: Create the tag and the release
        env:
          GH_TOKEN: ${{ github.token }}
          version: ${{ inputs.version }}
          sha: ${{ steps.target.outputs.sha }}
        run: |
          if gh release view "v$version" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v$version already exists; nothing to do."
            exit 0
          fi
          # A tag left by a failed run is reused by `gh release create`, whatever
          # --target says: it must name the commit resolved above, or the notes
          # of one text would be published over another.
          if tagged=$(git rev-parse -q --verify "refs/tags/v$version^{commit}"); then
            if [ "$tagged" != "$sha" ]; then
              echo "Tag v$version points at $tagged, not $sha; refusing to publish." >&2
              exit 1
            fi
          fi
          gh release create "v$version" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$sha" \
            --title "v$version" \
            --notes-file RELEASE_NOTES.md
