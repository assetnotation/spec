name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung job would otherwise bill until the 6h ceiling
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint specification prose
        run: npm run lint:md
      - name: Validate examples against the schema
        run: npm run validate

      # Audited without --omit=dev: this repository declares no runtime
      # dependencies at all, so an audit that skipped dev ones would look at
      # nothing. The three dev packages are what validates the schema and the
      # prose, and a compromised one of them ships a wrong specification.
      - name: Audit dependencies
        run: npm audit --audit-level=high
