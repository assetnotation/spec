name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Lint and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10 # a hung job would otherwise bill until the 6h ceiling
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Lint specification prose
        run: npm run lint:md
      - name: Validate examples against the schema
        run: npm run validate
